name: Actualizar noticias y resultados
on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub puede retrasarlo varios minutos
  workflow_dispatch:
  push:
    branches: [midterm2026]
    paths-ignore: ["news.json", "results.json"]
permissions:
  contents: write
concurrency: datos
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: midterm2026   # la rama que publica GitHub Pages
      - name: Noticias (RSS de medios de EE.UU.)
        run: python3 news.py || true
      - name: Resultados AP (sólo 3-5 nov UTC y si hay clave)
        env:
          AP_API_KEY: ${{ secrets.AP_API_KEY }}
        run: |
          if [ -n "$AP_API_KEY" ]; then
            case "$(date -u +%F)" in 2026-11-03|2026-11-04|2026-11-05) python3 ap_results.py || true ;; *) echo "fuera de fecha" ;; esac
          fi
      - name: Commit si cambió
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add news.json results.json
          git diff --cached --quiet || (git commit -m "datos: noticias/resultados" && git pull --rebase -q origin midterm2026 && git push origin HEAD:midterm2026)
