name: Actualizar resultados AP
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub puede retrasarlo varios minutos
  workflow_dispatch:
permissions:
  contents: write
concurrency: ap
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar de AP (solo 3-4 nov UTC)
        env:
          AP_API_KEY: ${{ secrets.AP_API_KEY }}
        run: |
          case "$(date -u +%F)" in 2026-11-03|2026-11-04|2026-11-05) python3 ap_results.py ;; *) echo "fuera de fecha" ;; esac
      - name: Commit si cambió
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add results.json
          git diff --cached --quiet || (git commit -m "resultados AP" && git push)
